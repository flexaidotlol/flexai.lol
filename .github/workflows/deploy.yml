name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Live Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '77.42.124.150' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "========================================="
            echo "🚀 VPS DEPLOYMENT STARTED"
            echo "User: $(whoami)"
            echo "Host: $(hostname)"
            echo "========================================="

            # 1. Environment & Paths
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$HOME/.profile" ] && \. "$HOME/.profile"
            [ -s "$HOME/.bashrc" ] && \. "$HOME/.bashrc"
            export PATH="/root/.nvm/versions/node/$(ls /root/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:$PATH"

            echo "--- Active Ports & Listening Services ---"
            ss -tulpn 2>/dev/null | grep -E "80|443|3000|4321|8080|node|nginx" || true

            echo "--- Active Docker Containers ---"
            docker ps -a 2>/dev/null || true

            echo "--- Active PM2 Processes ---"
            pm2 list 2>/dev/null || true

            echo "--- Nginx Sites Configuration ---"
            cat /etc/nginx/sites-enabled/* 2>/dev/null || cat /etc/nginx/conf.d/* 2>/dev/null || true

            # 1. Target exact FlexAI directory (/var/www/flexai.lol)
            APP_DIR="/var/www/flexai.lol"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "📥 Fresh cloning repository into $APP_DIR..."
              rm -rf "$APP_DIR"
              git clone https://github.com/flexaidotlol/flexai.lol.git "$APP_DIR"
            fi

            echo "📁 Entering project directory: $APP_DIR"
            cd "$APP_DIR" || exit 1

            echo "📥 Syncing latest code from GitHub main..."
            git remote set-url origin https://github.com/flexaidotlol/flexai.lol.git 2>/dev/null || true
            git fetch --all --prune
            git reset --hard origin/main
            git clean -fd

            echo "🔍 VPS Live Git Commit: $(git log -1 --oneline)"

            echo "🧹 Cleaning previous build cache..."
            rm -rf dist .astro node_modules/.astro

            echo "📦 Running npm install..."
            npm install

            echo "🔨 Running production astro build..."
            npm run build

            # 2. Configure indestructible native Linux Systemd service
            NODE_BIN="$(which node)"
            echo "Node Binary Path: $NODE_BIN"

            # Clean any old PM2 or rogue processes on port 4321
            fuser -k 4321/tcp 2>/dev/null || true
            if command -v pm2 &> /dev/null; then
              pm2 delete all 2>/dev/null || true
              pm2 kill 2>/dev/null || true
            fi

            # Write clean systemd service file
            printf "[Unit]\nDescription=FlexAI Astro SSR Node Server\nAfter=network.target\n\n[Service]\nType=simple\nUser=root\nWorkingDirectory=/var/www/flexai.lol\nEnvironment=NODE_ENV=production\nEnvironment=HOST=127.0.0.1\nEnvironment=PORT=4321\nExecStart=%s /var/www/flexai.lol/dist/server/entry.mjs\nRestart=always\nRestartSec=2\nStandardOutput=journal\nStandardError=journal\n\n[Install]\nWantedBy=multi-user.target\n" "$NODE_BIN" > /etc/systemd/system/flexai.service

            systemctl daemon-reload
            systemctl enable flexai
            systemctl restart flexai
            sleep 3

            echo "✅ Service Status:"
            systemctl status flexai --no-pager -l || true

            echo "✅ Port 4321 Response:"
            curl -sI "http://127.0.0.1:4321" | head -n 10 || true

            echo "📁 Checking dist client static assets:"
            ls -la /var/www/flexai.lol/dist/client/_astro/ 2>/dev/null || true

            CSS_FILE=$(ls /var/www/flexai.lol/dist/client/_astro/*.css 2>/dev/null | head -n 1 | xargs -n 1 basename 2>/dev/null || true)
            if [ -n "$CSS_FILE" ]; then
              echo "🎨 Testing CSS delivery from Node server: /_astro/$CSS_FILE"
              curl -sI "http://127.0.0.1:4321/_astro/$CSS_FILE" | head -n 5 || true
            fi

            # 3. Reload Nginx
            if command -v nginx &> /dev/null; then
              echo "🔄 Checking Nginx Configuration:"
              nginx -t || true
              systemctl reload nginx 2>/dev/null || systemctl restart nginx 2>/dev/null || nginx -s reload 2>/dev/null || true
            fi

            echo "🎉 SUCCESS: FlexAI running permanently via Systemd on port 4321!"
