name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Live Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '77.42.124.150' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "========================================="
            echo "🚀 VPS DEPLOYMENT STARTED"
            echo "User: $(whoami)"
            echo "Host: $(hostname)"
            echo "========================================="

            # 1. Environment & Paths
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$HOME/.profile" ] && \. "$HOME/.profile"
            [ -s "$HOME/.bashrc" ] && \. "$HOME/.bashrc"
            export PATH="/root/.nvm/versions/node/$(ls /root/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:$PATH"

            echo "--- Active Ports & Listening Services ---"
            ss -tulpn 2>/dev/null | grep -E "80|443|3000|4321|8080|node|nginx" || true

            echo "--- Active Docker Containers ---"
            docker ps -a 2>/dev/null || true

            echo "--- Active PM2 Processes ---"
            pm2 list 2>/dev/null || true

            echo "--- Nginx Sites Configuration ---"
            grep -rh "proxy_pass\|root " /etc/nginx/sites-enabled/ 2>/dev/null || grep -rh "proxy_pass\|root " /etc/nginx/conf.d/ 2>/dev/null || true

            # 2. Locate the EXACT FlexAI directory on VPS
            APP_DIR="${{ secrets.VPS_APP_PATH }}"

            # Try to get CWD of active process on port 4321
            if [ -z "$APP_DIR" ]; then
              NODE_PID=$(ss -tulpn | grep 4321 | grep -oE "pid=[0-9]+" | cut -d= -f2 | head -n 1 || true)
              if [ -n "$NODE_PID" ] && [ -d "/proc/$NODE_PID/cwd" ]; then
                PROC_DIR=$(readlink -f /proc/$NODE_PID/cwd 2>/dev/null || true)
                if [ -n "$PROC_DIR" ] && [ -d "$PROC_DIR" ]; then
                  APP_DIR="$PROC_DIR"
                  echo "🎯 Found FlexAI from active process on port 4321: $APP_DIR"
                fi
              fi
            fi

            # Fallback search specifically for flexai or FlexAI
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
              APP_DIR=$(find /root /home /var/www /var /srv /opt -maxdepth 4 -type d -iname "*flexai*" 2>/dev/null | head -n 1 || true)
            fi

            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
              APP_DIR=$(find /root /home /var/www /var /srv /opt -maxdepth 5 -name "astro.config.mjs" 2>/dev/null | grep -i "flex" | head -n 1 | xargs dirname || true)
            fi

            if [ -z "$APP_DIR" ]; then
              echo "❌ Could not find FlexAI directory on VPS."
              exit 1
            fi

            echo "🎯 FlexAI Directory: $APP_DIR"
            cd "$APP_DIR" || exit 1

            echo "📥 Fetching and syncing latest code from GitHub main..."
            git remote set-url origin https://github.com/flexaidotlol/flexai.lol.git 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Running npm install..."
            npm install

            echo "🔨 Running production build..."
            npm run build

            # 3. Kill whatever process is currently occupying port 4321
            echo "🔄 Freeing port 4321 and restarting PM2..."
            fuser -k 4321/tcp 2>/dev/null || true
            NODE_OLD_PID=$(ss -tulpn | grep 4321 | grep -oE "pid=[0-9]+" | cut -d= -f2 | head -n 1 || true)
            if [ -n "$NODE_OLD_PID" ]; then
              kill -9 "$NODE_OLD_PID" 2>/dev/null || true
            fi

            # 4. Start fresh PM2 service
            if command -v pm2 &> /dev/null; then
              pm2 delete flexai 2>/dev/null || true
              HOST=0.0.0.0 PORT=4321 pm2 start dist/server/entry.mjs --name flexai --update-env
              pm2 save --force
            fi

            sleep 2
            # Verify if port 4321 is alive, if not launch direct node
            if ! curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4321 | grep -q "200\|301\|302"; then
              echo "⚠️ Starting direct node server..."
              HOST=0.0.0.0 PORT=4321 nohup node dist/server/entry.mjs > flexai.log 2>&1 &
              sleep 2
            fi

            echo "✅ Port 4321 response:"
            curl -sI http://127.0.0.1:4321 | head -n 5 || true

            # 5. Reload Nginx
            if command -v nginx &> /dev/null; then
              nginx -t 2>/dev/null && nginx -s reload 2>/dev/null || true
            fi

            echo "🎉 SUCCESS: FlexAI rebuilt and running live on port 4321!"
