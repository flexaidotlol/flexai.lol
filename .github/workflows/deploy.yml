name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Live Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '77.42.124.150' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 Starting deployment on VPS..."
            
            # Find and enter project directory
            APP_DIR="${{ secrets.VPS_APP_PATH }}"
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
              APP_DIR=$(find /root /var/www /home /var -maxdepth 4 -name "astro.config.mjs" 2>/dev/null | head -n 1 | xargs dirname)
            fi

            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
              APP_DIR=$(pwd)
            fi

            echo "📁 Target directory: $APP_DIR"
            cd "$APP_DIR" || exit 1

            echo "📥 Fetching and resetting to latest origin/main..."
            git remote set-url origin https://github.com/flexaidotlol/flexai.lol.git 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Installing npm dependencies..."
            npm install --production=false

            echo "🔨 Running production build..."
            npm run build

            echo "🔄 Reloading PM2 and services..."
            if command -v pm2 &> /dev/null; then
              pm2 reload all --update-env || pm2 restart all || pm2 start dist/server/entry.mjs --name flexai
              pm2 save
            fi

            # If systemd flexai service exists
            if systemctl is-active --quiet flexai 2>/dev/null; then
              systemctl restart flexai
            fi

            # Clear any Nginx cache if exists
            if command -v nginx &> /dev/null; then
              nginx -s reload 2>/dev/null || true
            fi

            echo "✅ Deployment completed successfully!"
