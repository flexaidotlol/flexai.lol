name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Live Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '77.42.124.150' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "========================================="
            echo "🚀 VPS DEPLOYMENT STARTED"
            echo "User: $(whoami)"
            echo "Host: $(hostname)"
            echo "========================================="

            # 1. Environment & Paths
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$HOME/.profile" ] && \. "$HOME/.profile"
            [ -s "$HOME/.bashrc" ] && \. "$HOME/.bashrc"
            export PATH="/root/.nvm/versions/node/$(ls /root/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:$PATH"

            echo "--- Active Ports & Listening Services ---"
            ss -tulpn 2>/dev/null | grep -E "80|443|3000|4321|8080|node|nginx" || true

            echo "--- Active Docker Containers ---"
            docker ps -a 2>/dev/null || true

            echo "--- Active PM2 Processes ---"
            pm2 list 2>/dev/null || true

            echo "--- Nginx Sites Configuration ---"
            grep -rh "proxy_pass\|root " /etc/nginx/sites-enabled/ 2>/dev/null || grep -rh "proxy_pass\|root " /etc/nginx/conf.d/ 2>/dev/null || true

            # 1. Target exact FlexAI directory (/var/www/flexai.lol)
            APP_DIR="/var/www/flexai.lol"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "📥 Fresh cloning repository into $APP_DIR..."
              rm -rf "$APP_DIR"
              git clone https://github.com/flexaidotlol/flexai.lol.git "$APP_DIR"
            fi

            echo "📁 Entering project directory: $APP_DIR"
            cd "$APP_DIR" || exit 1

            echo "📥 Syncing latest code from GitHub main..."
            git remote set-url origin https://github.com/flexaidotlol/flexai.lol.git 2>/dev/null || true
            git fetch --all --prune
            git reset --hard origin/main
            git clean -fd

            echo "🔍 VPS Live Git Commit: $(git log -1 --oneline)"

            echo "🧹 Cleaning previous build cache..."
            rm -rf dist .astro node_modules/.astro

            echo "📦 Running npm install..."
            npm install

            echo "🔨 Running production astro build..."
            npm run build

            # 2. Setup PM2 managed by Systemd
            echo "🔄 Configuring PM2 with Systemd daemon..."
            ln -sf "$(which node)" /usr/local/bin/node 2>/dev/null || true
            ln -sf "$(which npm)" /usr/local/bin/npm 2>/dev/null || true
            ln -sf "$(which pm2)" /usr/local/bin/pm2 2>/dev/null || true

            # Clean any old processes on port 4321
            fuser -k 4321/tcp 2>/dev/null || true
            systemctl stop flexai 2>/dev/null || true
            systemctl disable flexai 2>/dev/null || true
            rm -f /etc/systemd/system/flexai.service 2>/dev/null || true
            systemctl daemon-reload 2>/dev/null || true
            sleep 1

            if command -v pm2 &> /dev/null; then
              pm2 delete flexai 2>/dev/null || true
              pm2 delete all 2>/dev/null || true
              HOST=127.0.0.1 PORT=4321 pm2 start dist/server/entry.mjs --name flexai --update-env
              pm2 save --force
              env PATH=$PATH:/usr/local/bin:/usr/bin pm2 startup systemd -u root --hp /root 2>/dev/null || pm2 startup 2>/dev/null || true
              pm2 save --force
            else
              HOST=127.0.0.1 PORT=4321 nohup node dist/server/entry.mjs > /var/log/flexai.log 2>&1 &
            fi

            sleep 2
            echo "✅ Port 4321 Status:"
            curl -sI "http://127.0.0.1:4321" | head -n 10 || true

            # Check logs if not 200
            if ! curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:4321" | grep -q "200\|301\|302"; then
              echo "❌ PM2 Logs:"
              pm2 logs flexai --lines 30 --nostream 2>/dev/null || cat /var/log/flexai.log 2>/dev/null || true
            fi

            # 3. Reload Nginx
            if command -v nginx &> /dev/null; then
              nginx -t 2>/dev/null && (systemctl reload nginx 2>/dev/null || systemctl restart nginx 2>/dev/null || nginx -s reload 2>/dev/null || true)
            fi

            echo "🎉 SUCCESS: FlexAI permanently active and managed by PM2 Systemd on port 4321!"
