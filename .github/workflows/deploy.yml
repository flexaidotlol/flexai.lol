name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Live Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '77.42.124.150' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "========================================="
            echo "🚀 VPS DEPLOYMENT STARTED"
            echo "User: $(whoami)"
            echo "Host: $(hostname)"
            echo "========================================="

            # 1. Inspect PM2 to find the running app's exact folder
            APP_DIR=""
            if command -v pm2 &> /dev/null; then
              echo "--- Current PM2 Processes ---"
              pm2 list || true
              PM2_DIR=$(pm2 jlist 2>/dev/null | grep -o '"pm_cwd":"[^"]*' | head -n 1 | cut -d'"' -f4 || true)
              if [ -n "$PM2_DIR" ] && [ -d "$PM2_DIR" ]; then
                APP_DIR="$PM2_DIR"
                echo "🎯 Found active PM2 working directory: $APP_DIR"
              fi
            fi

            # 2. Fallback search if PM2 didn't yield path
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
              APP_DIR=$(find /root /home /var /www /srv /opt -maxdepth 5 -name "astro.config.mjs" 2>/dev/null | head -n 1 | xargs dirname || true)
            fi

            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
              echo "⚠️ Could not auto-detect directory, using pwd: $(pwd)"
              APP_DIR=$(pwd)
            fi

            echo "📁 Entering project directory: $APP_DIR"
            cd "$APP_DIR"

            echo "📥 Syncing latest code from GitHub main..."
            git remote set-url origin https://github.com/flexaidotlol/flexai.lol.git 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Installing npm packages..."
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            npm install

            echo "🔨 Compiling production build..."
            npm run build

            echo "🔄 Restarting web server..."
            if command -v pm2 &> /dev/null; then
              pm2 reload all --update-env || pm2 restart all || pm2 start dist/server/entry.mjs --name flexai
              pm2 save
            fi

            if systemctl is-active --quiet flexai 2>/dev/null; then
              systemctl restart flexai
            fi

            if command -v nginx &> /dev/null; then
              nginx -s reload 2>/dev/null || true
            fi

            echo "🎉 SUCCESS: FlexAI deployed and live on VPS!"
